[project]
name = "video-benchmark-mvp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["video-provider-core>=0.2.0", "httpx>=0.27,<1", "python-dotenv>=1,<2"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[project.scripts]
vbench = "benchmark.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["benchmark*"]

[tool.uv.sources]
video-provider-core = { path = "../video-provider-core", editable = true }
