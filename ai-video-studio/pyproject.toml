[project]
name = "ai-video-studio"
version = "0.9.5"
description = "Recoverable CLI-first AI video studio MVP"
requires-python = ">=3.11"
dependencies = ["video-provider-core>=0.2.0", "typer>=0.12,<1", "rich>=13,<15", "httpx>=0.27,<1", "python-dotenv>=1,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9,<1"]
[project.scripts]
studio = "studio.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["studio"]

[tool.uv.sources]
video-provider-core = { path = "../video-provider-core", editable = true }
